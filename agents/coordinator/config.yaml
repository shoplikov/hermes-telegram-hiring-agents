# Job War Room — coordinator (installed by scripts/setup.sh; edit in repo, re-run setup)
model:
  default: gpt-5.4-mini
  provider: openai-api
  base_url: https://api.openai.com/v1
agent:
  reasoning_effort: medium
  max_turns: 30
platform_toolsets:
  telegram: [memory, session_search, todo, skills]
telegram:
  require_mention: true
  exclusive_bot_mentions: true
  bots_require_mention: true
  allow_bots: mentions
  mention_patterns: []
  reply_to_mode: first
skills:
  external_dirs:
    - __REPO__/agents/coordinator/skills
memory:
  memory_enabled: true
  user_profile_enabled: true

# One shared session per group: the coordinator must see the user's request AND the
# specialists' RESULT messages in the same context (default true = one session per sender).
group_sessions_per_user: false
display:
  # A RESULT arriving while the agent is mid-turn waits for the next turn instead of
  # interrupting (default "interrupt" redirected the coordinator's run).
  busy_input_mode: queue
