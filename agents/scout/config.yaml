# Job War Room — scout (installed by scripts/setup.sh; edit in repo, re-run setup)
model:
  default: gpt-5.6-luna
  provider: openai-api
  base_url: https://api.openai.com/v1
agent:
  reasoning_effort: low
  max_turns: 30
platform_toolsets:
  telegram: [web, memory]
telegram:
  require_mention: true
  exclusive_bot_mentions: true
  bots_require_mention: true
  allow_bots: mentions
  mention_patterns: []
  reply_to_mode: first
skills:
  external_dirs:
    - __PROFILE_HOME__/war-room-skills   # rendered from the repo by scripts/setup.sh
memory:
  memory_enabled: true
  user_profile_enabled: true
web:
  backend: ddgs            # search: keyless DuckDuckGo results (snippets only)
  extract_backend: firecrawl  # web_extract: full page text via Hermes' keyless free tier (job links)
# Documents intent only: under a multiplexed gateway Hermes reads this key from the DEFAULT
# profile's config.yaml (see README step 5 and docs/failures.md #5). It must be false there.
group_sessions_per_user: false
display:
  # A RESULT arriving while the agent is mid-turn waits for the next turn instead of
  # interrupting (default "interrupt" redirected the coordinator's run).
  busy_input_mode: queue
