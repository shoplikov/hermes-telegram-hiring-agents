# Job War Room — cv-analyst (installed by scripts/setup.sh; edit in repo, re-run setup)
model:
  default: gpt-5.6-terra
  provider: openai-api
  base_url: https://api.openai.com/v1
agent:
  reasoning_effort: medium
  max_turns: 30
platform_toolsets:
  telegram: [file, terminal, memory, skills]
telegram:
  require_mention: true
  exclusive_bot_mentions: true
  bots_require_mention: true
  allow_bots: mentions
  mention_patterns: []
  reply_to_mode: first
skills:
  external_dirs:
    - __REPO__/agents/cv-analyst/skills
memory:
  memory_enabled: true
  user_profile_enabled: true
terminal:
  cwd: __PROFILE_HOME__
